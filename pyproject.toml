[project]
name = "aria-agentic-routine-intelligence-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
format = [
    "black>=24.8.0",
    "isort>=5.13.2",
]
lint = [
    "ruff>=0.6.9",
]
typecheck = [
    "mypy>=1.11.2",
]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]
dev = [
    "black>=24.8.0",
    "isort>=5.13.2",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"db/test_db.py" = ["E402"]
"models/test_models.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["db"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
